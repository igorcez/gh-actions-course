name: "01 - Building Blocks"
on: [push, workflow_dispatch]
jobs:
  echo-hello:
    name: "echo-hello"
    runs-on: ubuntu-latest
    steps:
      - name: "Say hello"
        run: echo Hello, world!
  echo-goodbye:
    name: "echo-goodbye"
    runs-on: ubuntu-latest
    steps:
      - name: "Failed step"
        run: | 
          echo I will fail
          exit 0
      - name: "Say goodbye"
        run: echo Goodbye!