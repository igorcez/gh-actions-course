name: 20 - Workflow Security
on:
    workflow_dispatch:
jobs:
    unsafe-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Check PR title
              run: |
                title=${{ github.event.pull_request.title }}
                if [[ $title =~ ^feat ]]; then
                echo "PR is a feature"
                exit 0
                else
                echo "PR is not a feature"
                exit 1
                fi
            
    safer-pr:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
        
          - name: Check PR title
            env:
              TITLE: ${{ github.event.pull_request.title }}
            run: |
                if [[ $TITLE =~ ^feat ]]; then
                echo "PR is a feature"
                exit 0
                else
                echo "PR is not a feature"
                exit 1
                fi