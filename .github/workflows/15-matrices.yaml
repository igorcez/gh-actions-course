    include-example:
        name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                color:
                    - red
                    - green
                shape:
                    - circle
                    - square
                size:
                    - small
                    - large
                include:
                    - color: red
                      shape: triangle
        steps:
            - name: "Print matrix values"
              run: |
                echo "Color: ${{ matrix.color }}"
                echo "Shape: ${{ matrix.shape }}"
                echo "Size: ${{ matrix.size }}" 
