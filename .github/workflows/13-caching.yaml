name: 13 - Using Caching
on:
    workflow_dispatch:
        inputs:
            use-cache:
                description: "Whether to execute cache step"
                type: boolean
                default: true
            node-version:
                description: "Node version"
                type: choice
                default: "24.x"
                options:
                    - "24.x"
                    - "26.x"
defaults:
    run:
        working-directory: 13-caching/react-app
jobs:
    build:
        needs: install-deps
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v7

            - name: "Set up Node.js"
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ inputs.node-version }}
            
            - name: Download cached dependencies
              id: cache
              uses: actions/cache@v6
              with:
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
                path: 13-caching/react-app/node_modules
                
            # - name: "Install dependencies"
            #   if: ${{ steps.cache.outputs.cache-hit != 'true' }}
            #   run: |
            #       npm ci

            - name: "Testing"
              run: |
                  npm run test
            
            - name: Building
              run: |
                  npm run build
            
            - name: Deploying to nonprod
              run: |
                  echo "Deploying to nonprod"
    
    install-deps:
        runs-on: ubuntu-latest
        outputs:
            deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v7

            - name: "Set up Node.js"
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ inputs.node-version }}
            
            - name: Calculate cache key
              id: cache-key
              run: |
                echo "CACHE_KEY=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> $GITHUB_OUTPUT

            - name: Download cached dependencies 2
              id: cache2
              if: ${{ inputs.use-cache }}
              uses: actions/cache@v6
              with:
                key: ${{ steps.cache-key.outputs.CACHE_KEY }}
                path: 13-caching/react-app/node_modules

            - name: "Install dependencies"
              if: ${{ steps.cache2.outputs.cache-hit != 'true' }}
              run: |
                  npm ci
    
    linting:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v7

            - name: "Set up Node.js"
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ inputs.node-version }}
            
            - name: Download cached dependencies 3
              id: cache3
              uses: actions/cache@v6
              with:
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
                path: 13-caching/react-app/node_modules
            
            - name: "Testing"
              run: |
                  npm run test
            
            - name: "Linting"
              run: |
                  echo "Linting..."
